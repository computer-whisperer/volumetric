[package]
name = "volumetric_preview"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["native"]
# Desktop: wasmtime model executors and the in-process mesh cache.
native = ["volumetric/native"]
# Browser: JS-bridge model executors. Build with
# `--target wasm32-unknown-unknown --no-default-features --features web`.
web = ["volumetric/web"]

[dependencies]
anyhow = "1"
glam = "0.32"
volumetric = { path = "../../", default-features = false }
volumetric_renderer = { path = "../volumetric_renderer" }
web-time = "1"

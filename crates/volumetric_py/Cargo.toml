[package]
name = "volumetric_py"
version = "0.1.0"
edition = "2024"
description = "Python bindings over volumetric's kernels: projects, view sets, splats, marker detection and the survey"

[lib]
name = "_volumetric"
crate-type = ["cdylib"]
# An extension module cannot link a test binary (no libpython); the tests
# are pytest, see tests/.
test = false
doctest = false

[dependencies]
volumetric = { path = "../../" }
volumetric_abi = { path = "../volumetric_abi" }
volumetric_assets = { path = "../volumetric_assets" }
volumetric_protocol = { path = "../volumetric_protocol", features = ["client"] }
view_core = { path = "../view_core" }
cv_core = { path = "../cv_core" }
pyo3 = { version = "0.29", features = ["abi3-py312", "extension-module"] }
numpy = "0.29"
pythonize = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[package]
name = "volumetric_cli"
version = "0.1.0"
edition = "2024"

[dependencies]
volumetric = { path = "../../" }
fea_bundle = { path = "../fea_bundle" }
volumetric_abi = { path = "../volumetric_abi" }
volumetric_assets = { path = "../volumetric_assets" }
view_core = { path = "../view_core" }
cloud_core = { path = "../cloud_core" }
cv_core = { path = "../cv_core" }
volumetric_preview = { path = "../volumetric_preview" }
volumetric_protocol = { path = "../volumetric_protocol", features = ["client"] }
volumetric_renderer = { path = "../volumetric_renderer" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
glam = "0.32"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasmtime = "44"
base64 = "0.22"
ciborium = "0.2"
